<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#ring)" stroke-width="2"/>
  <!-- Forge hammer silhouette -->
  <rect x="18" y="10" width="12" height="8" rx="2" fill="url(#gold)"/>
  <rect x="22" y="18" width="4" height="14" rx="1.5" fill="url(#gold)"/>
  <!-- Ember sparks -->
  <circle cx="14" cy="30" r="1.5" fill="#f97316" opacity="0.8"/>
  <circle cx="34" cy="28" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="16" cy="36" r="1" fill="#ef4444" opacity="0.6"/>
  <circle cx="32" cy="36" r="1.5" fill="#f97316" opacity="0.8"/>
  <circle cx="24" cy="37" r="1" fill="#fbbf24" opacity="0.5"/>
  <defs>
    <linearGradient id="ring" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="gold" x1="18" y1="10" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
</svg>
