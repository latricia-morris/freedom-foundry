components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    FreeObject:
      type: object
      additionalProperties: true

    LinkObject:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      additionalProperties: true

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        first_name:
          type: string
